<!doctype html>
<!-- Thin shell for a phone-captured tour. The viewer itself (Photo Sphere
     Viewer + three.js bundled together, plus tour-app.js/css) lives in the
     bucket's tour-viewer/current/ folder, shared by every tour, so viewer
     fixes and upgrades reach existing tours without re-publishing them. It
     is served from the SAME bucket as this page - no third-party CDN. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{TOUR_TITLE}} — Virtual Tour</title>
<link rel="stylesheet" href="{{VIEWER_BASE}}/psv-viewer.css" />
<link rel="stylesheet" href="{{VIEWER_BASE}}/tour-app.css" />
<style>html,body{margin:0;height:100%;background:#0b0b0f}</style>
</head>
<body>
<div id="tour-root">
  <div id="loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:14px sans-serif;opacity:.8;text-align:center;padding:24px">Loading tour…</div>
  <div id="empty" style="display:none">This tour has no rooms yet.</div>
  <div id="viewer"></div>
  <div id="flat"><img id="flat-img" alt="" /></div>
  <div id="gallery">
    <button class="gallery-nav prev" aria-label="Previous photo">&#8249;</button>
    <img id="gallery-img" alt="" />
    <button class="gallery-nav next" aria-label="Next photo">&#8250;</button>
    <div class="gallery-counter" id="gallery-counter"></div>
  </div>
  <div id="notice" role="status"></div>
  <div id="title-bar">
    <h1 id="tour-title">{{TOUR_TITLE}}</h1>
    <p id="room-subtitle"></p>
  </div>
  <div id="room-bar"></div>
</div>

<script src="{{VIEWER_BASE}}/psv-viewer.js"></script>
<script src="{{VIEWER_BASE}}/tour-app.js"></script>
<script>
  // If the viewer files themselves couldn't be fetched (offline, blocked
  // host), say so instead of leaving "Loading tour…" up forever.
  window.addEventListener('load', function () {
    if (window.__tourAppLoaded) return;
    var el = document.getElementById('loading');
    if (el) el.textContent = 'Could not load the tour viewer. Check your connection and reload.';
  });
</script>
</body>
</html>
