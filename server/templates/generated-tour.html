<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{TOUR_TITLE}} — Virtual Tour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #tour-root { position: relative; height: 100%; width: 100%; overflow: hidden; }
  #viewer { position: absolute; inset: 0; }
  #gallery { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000; }
  #gallery img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.45); color: #fff; border: none; width: 44px; height: 44px; border-radius: 999px; font-size: 20px; cursor: pointer; }
  .gallery-nav.prev { left: 16px; }
  .gallery-nav.next { right: 16px; }
  .gallery-counter { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,.45); padding: 4px 12px; border-radius: 999px; font-size: 13px; }
  #room-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); overflow-x: auto; background: linear-gradient(to top, rgba(0,0,0,.75), transparent); z-index: 10; -webkit-overflow-scrolling: touch; }
  .room-chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; font-size: 13px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  .room-chip.active { background: #fff; color: #0b0b0f; font-weight: 600; }
  .room-chip .badge { opacity: .7; font-size: 11px; margin-left: 6px; }
  #title-bar { position: absolute; top: 0; left: 0; right: 0; padding: 16px; color: #fff; background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent); z-index: 10; pointer-events: none; }
  #title-bar h1 { margin: 0; font-size: 16px; font-weight: 600; }
  #title-bar p { margin: 2px 0 0; font-size: 12px; opacity: .75; }
  #loading, #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; opacity: .8; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="tour-root">
  <div id="loading">Loading tour…</div>
  <div id="empty" style="display:none">This tour has no rooms yet.</div>
  <div id="viewer"></div>
  <div id="gallery">
    <button class="gallery-nav prev" aria-label="Previous photo">&#8249;</button>
    <img id="gallery-img" alt="" />
    <button class="gallery-nav next" aria-label="Next photo">&#8250;</button>
    <div class="gallery-counter" id="gallery-counter"></div>
  </div>
  <div id="title-bar">
    <h1 id="tour-title">{{TOUR_TITLE}}</h1>
    <p id="room-subtitle"></p>
  </div>
  <div id="room-bar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.js"></script>
<!-- Official Stereo/VR plugin: adds a headset-icon navbar button that
     splits the panorama into a left/right-eye stereo view driven by the
     device's gyroscope - the standard "slot your phone into a Cardboard-
     style headset" VR mode for 360 photo tours, and the real
     implementation behind this viewer's VR entry point (see renderPanorama
     and the postMessage listener below). Must load after core - it
     extends the PhotoSphereViewer global core.js defines. -->
<script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/stereo-plugin@5/index.min.js"></script>
<script>
(function () {
  var viewerEl = document.getElementById('viewer');
  var galleryEl = document.getElementById('gallery');
  var galleryImg = document.getElementById('gallery-img');
  var galleryCounter = document.getElementById('gallery-counter');
  var roomBar = document.getElementById('room-bar');
  var loadingEl = document.getElementById('loading');
  var emptyEl = document.getElementById('empty');
  var subtitleEl = document.getElementById('room-subtitle');

  var psvInstance = null;
  var galleryIndex = 0;
  var currentRoom = null;

  function showViewer() { viewerEl.style.display = 'block'; galleryEl.style.display = 'none'; }
  function showGallery() { viewerEl.style.display = 'none'; galleryEl.style.display = 'flex'; }

  function renderGallery(room) {
    showGallery();
    galleryIndex = 0;
    function render() {
      galleryImg.src = room.photos[galleryIndex];
      galleryCounter.textContent = (galleryIndex + 1) + ' / ' + room.photos.length;
    }
    render();
    document.querySelector('.gallery-nav.prev').onclick = function () {
      galleryIndex = (galleryIndex - 1 + room.photos.length) % room.photos.length;
      render();
    };
    document.querySelector('.gallery-nav.next').onclick = function () {
      galleryIndex = (galleryIndex + 1) % room.photos.length;
      render();
    };
  }

  // Stereo/VR mode only makes sense for a real 360° panorama - a
  // photo_sweep_lite "basic tour" room is just flat photos with no
  // equirectangular data to project into a headset, so this plugin is
  // only ever attached to the panorama viewer below, never the gallery.
  var stereoAvailable = typeof PhotoSphereViewer !== 'undefined' && !!PhotoSphereViewer.StereoPlugin;

  function renderPanorama(room) {
    showViewer();
    if (psvInstance) {
      psvInstance.setPanorama(room.panoUrl);
      return;
    }
    psvInstance = new PhotoSphereViewer.Viewer({
      container: viewerEl,
      panorama: room.panoUrl,
      // 'stereo' inserts the plugin's own headset-icon button - clicking
      // it (a real, direct user gesture) enters gyroscope-driven
      // split-screen VR mode, prompting for device-orientation permission
      // on iOS Safari where that's required. Degrades to the plain navbar
      // if the plugin script failed to load (offline CDN, etc.) rather
      // than crashing the whole tour.
      navbar: stereoAvailable ? ['zoom', 'stereo', 'fullscreen'] : ['zoom', 'fullscreen'],
      defaultZoomLvl: 0,
      loadingImg: undefined,
      plugins: stereoAvailable ? [PhotoSphereViewer.StereoPlugin] : [],
    });
  }

  // Lets an "Enter VR" button in our own wrapping UI (VirtualTourModal.tsx/
  // VirtualTour.tsx, via client/src/lib/tourVr.ts) trigger the exact same
  // stereo mode as clicking the plugin's own navbar icon, without needing
  // to know anything about this page's internals. No-op if the current
  // room isn't a panorama (nothing to view in VR) or the plugin didn't load.
  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.source !== 'realevr-tour' || data.action !== 'enter-vr') return;
    if (!stereoAvailable || !psvInstance || !currentRoom || currentRoom.mode !== 'panorama') return;
    try {
      var stereoPlugin = psvInstance.getPlugin(PhotoSphereViewer.StereoPlugin);
      if (stereoPlugin) stereoPlugin.toggle();
    } catch (err) {
      // Best-effort - the visible navbar button still works even if this
      // remote trigger doesn't for some reason.
    }
  });

  function selectRoom(room) {
    currentRoom = room;
    subtitleEl.textContent = room.mode === 'panorama' ? '360° panorama' : (room.photos.length + ' photos · basic tour');
    Array.prototype.forEach.call(roomBar.children, function (chip) {
      chip.classList.toggle('active', chip.dataset.slug === room.slug);
    });
    if (room.mode === 'panorama') {
      renderPanorama(room);
    } else {
      renderGallery(room);
    }
  }

  fetch('./tour.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      loadingEl.style.display = 'none';
      var rooms = data.rooms || [];
      if (rooms.length === 0) {
        emptyEl.style.display = 'flex';
        return;
      }
      document.getElementById('tour-title').textContent = data.title || '{{TOUR_TITLE}}';
      rooms.forEach(function (room) {
        var chip = document.createElement('button');
        chip.className = 'room-chip';
        chip.textContent = room.name;
        chip.dataset.slug = room.slug;
        if (room.qualityTier === 'photo_sweep_lite') {
          var badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'basic';
          chip.appendChild(badge);
        } else if (room.qualityTier === 'equirect_360' && stereoAvailable) {
          // Honest labeling: only a real 360° room with the stereo plugin
          // actually loaded can be viewed in a headset - never implied for
          // a flat photo_sweep_lite room above.
          var vrBadge = document.createElement('span');
          vrBadge.className = 'badge';
          vrBadge.textContent = 'VR';
          chip.appendChild(vrBadge);
        }
        chip.onclick = function () { selectRoom(room); };
        roomBar.appendChild(chip);
      });
      selectRoom(rooms[0]);
    })
    .catch(function (err) {
      loadingEl.textContent = 'Could not load this tour (' + err.message + ')';
    });
})();
</script>
</body>
</html>
