<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealEVR Estates | Virtual Property Tours</title>
    <meta name="description" content="Discover rental units, vacation BnBs, properties for sale, and bank sales with virtual tours. Search by location, price, and amenities on RealEVR Estates." />
    <meta name="theme-color" content="#211B17" />

    <!-- Baseline Open Graph / Twitter Card fallback (route-specific tags are set by
         PageSeo.tsx client-side, and server-side for social-preview bots — see
         server/social-preview.ts). This is what anything else sees. -->
    <meta property="og:site_name" content="RealEVR Estates" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RealEVR Estates | Virtual Property Tours" />
    <meta property="og:description" content="Discover rental units, vacation BnBs, properties for sale, and bank sales with virtual tours on RealEVR Estates." />
    <meta property="og:image" content="/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_UG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RealEVR Estates | Virtual Property Tours" />
    <meta name="twitter:description" content="Discover rental units, vacation BnBs, properties for sale, and bank sales with virtual tours on RealEVR Estates." />
    <meta name="twitter:image" content="/og-default.jpg" />

    <!-- Favicon (served from client/public → / at runtime) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Montserrat stays the body/UI typeface. Space Grotesk replaces Fraunces
         for display headlines — "NeoVision" theme (v2, GENE v1.9), a geometric
         technical face to match the black & white VR-forward redesign — see
         client/src/index.css for the full rationale. -->
    <!-- The font stylesheet no longer blocks the first paint: the page shows in a system font at once and the web fonts
         swap in when they arrive (display=swap is in the URL). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
    <!-- Font Awesome is self-hosted (client/src/main.tsx imports
         @fortawesome/fontawesome-free/css/all.min.css, bundled by Vite) as
         of GENE v1.11's mobile fix, not loaded from cdnjs.cloudflare.com
         here — see main.tsx for why. -->
    <!-- Critical first-paint styles: the page background, a header bar and a few shimmering blocks show at once, so a slow or
         dropped stylesheet on mobile data never leaves a blank or unstyled page. React replaces #root's contents when it starts. -->
    <style>
      html,body{margin:0;background:#fff;color:#1f2433;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .boot-bar{height:64px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;padding:0 16px}
      .boot-logo{width:36px;height:36px;border-radius:10px;background:#f5c469}
      .boot-search{flex:1;max-width:560px;height:40px;border-radius:999px;border:1px solid #e6e6ea;background:#fafafa}
      .boot-body{padding:24px 16px;max-width:1500px;margin:0 auto}
      .boot-h{height:34px;width:min(420px,80%);border-radius:8px;background:#f1eee8;margin-bottom:12px}
      .boot-p{height:16px;width:min(560px,90%);border-radius:8px;background:#f5f3ee;margin-bottom:10px}
      .boot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:28px}
      .boot-card{aspect-ratio:4/3;border-radius:16px;background:#f3f1ec}
      @media (prefers-reduced-motion:no-preference){.boot-h,.boot-p,.boot-card{animation:boot-pulse 1.4s ease-in-out infinite}}
      @keyframes boot-pulse{50%{opacity:.55}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-bar" aria-hidden="true"><div class="boot-logo"></div><div class="boot-search"></div></div>
      <div class="boot-body" aria-hidden="true">
        <div class="boot-h"></div><div class="boot-p"></div><div class="boot-p" style="width:min(380px,70%)"></div>
        <div class="boot-grid"><div class="boot-card"></div><div class="boot-card"></div><div class="boot-card"></div><div class="boot-card"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
